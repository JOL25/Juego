<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Circle vs Geometry</title>
<style>
/* ==========================================================
   NIGHTFALL SURVIVORS — theme tokens
   Palette: near-black wine bg, blood-red + aged-gold accents,
   bone text, cold teal for magic. Display face: Cinzel (engraved,
   gothic serif). Body/UI face: Inter.
   ========================================================== */

:root {
  --bg: #0c0709;
  --panel-bg: #1a1015;
  --panel-border: #4a2a2f;
  --red: #c1272d;
  --red-bright: #e0453f;
  --gold: #e8b13a;
  --bone: #f4ece0;
  --bone-dim: #cbb9a6;
  --teal: #7ec6e0;
  --shadow: rgba(0, 0, 0, 0.6);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--bg);
  overflow: hidden;
  font-family: 'Inter', sans-serif;
  color: var(--bone);
  -webkit-user-select: none;
  user-select: none;
}

#game-wrap {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at center, #1c1018 0%, #0c0709 75%);
}

#game-canvas {
  display: block;
  max-width: 100vw;
  max-height: 100vh;
  width: auto;
  height: auto;
  aspect-ratio: 960 / 540;
  background: #120a10;
  image-rendering: pixelated;
  box-shadow: 0 0 60px var(--shadow);
  touch-action: none;
}

/* --- Touch pause button --- */
.icon-button {
  position: absolute;
  top: 12px;
  right: 12px;
  z-index: 5;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--panel-border);
  background: rgba(10, 5, 8, 0.6);
  color: var(--bone);
  font-size: 16px;
  cursor: pointer;
}

.action-button {
  position: absolute;
  z-index: 5;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1px solid var(--panel-border);
  background: rgba(10, 5, 8, 0.72);
  color: var(--bone);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
}

.btn-dash {
  right: 16px;
  bottom: 18px;
}

.btn-ult {
  right: 80px;
  bottom: 18px;
  color: var(--gold);
}

/* --- Overlay screens --- */
.screen {
  position: absolute;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(6, 3, 5, 0.72);
  backdrop-filter: blur(2px);
}

.screen.hidden {
  display: none;
}

.panel {
  background: linear-gradient(180deg, #201319 0%, #150c10 100%);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 32px 36px;
  max-width: 90vw;
  width: 420px;
  text-align: center;
  box-shadow: 0 20px 50px var(--shadow), inset 0 0 0 1px rgba(232, 177, 58, 0.08);
  position: relative;
}

.panel::before {
  content: '';
  position: absolute;
  inset: 6px;
  border: 1px solid rgba(232, 177, 58, 0.15);
  border-radius: 3px;
  pointer-events: none;
}

.panel-menu {
  width: 460px;
}

.panel-levelup {
  width: min(94vw, 640px);
}

.game-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: clamp(28px, 5vw, 40px);
  letter-spacing: 0.03em;
  margin: 0 0 8px;
  color: var(--gold);
  text-shadow: 0 0 24px rgba(232, 177, 58, 0.35);
}

.section-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 24px;
  margin: 0 0 4px;
  color: var(--bone);
}

.section-title.danger {
  color: var(--red-bright);
}

.subtitle {
  color: var(--bone-dim);
  font-size: 14px;
  margin: 0 0 22px;
  line-height: 1.5;
}

.controls-hint {
  margin-top: 20px;
  font-size: 12px;
  color: var(--bone-dim);
  line-height: 1.8;
  border-top: 1px solid var(--panel-border);
  padding-top: 14px;
}

.btn-primary, .btn-secondary {
  display: block;
  width: 100%;
  padding: 13px 20px;
  margin: 8px 0 0;
  font-family: 'Inter', sans-serif;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.02em;
  border-radius: 4px;
  cursor: pointer;
  transition: transform 0.08s ease, box-shadow 0.15s ease;
}

.btn-primary {
  background: linear-gradient(180deg, var(--red-bright), var(--red));
  color: var(--bone);
  border: 1px solid rgba(255, 255, 255, 0.15);
  box-shadow: 0 6px 18px rgba(193, 39, 45, 0.35);
}

.btn-secondary {
  background: transparent;
  color: var(--bone-dim);
  border: 1px solid var(--panel-border);
}

.btn-primary:hover, .btn-secondary:hover {
  transform: translateY(-1px);
}

.btn-primary:active, .btn-secondary:active {
  transform: translateY(0);
}

/* --- Level-up cards --- */
.levelup-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-top: 10px;
}

.levelup-card {
  background: linear-gradient(180deg, rgba(232, 177, 58, 0.06), transparent);
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  padding: 18px 12px;
  color: var(--bone);
  cursor: pointer;
  text-align: center;
  transition: border-color 0.15s ease, transform 0.1s ease, background 0.15s ease;
}

.levelup-card:hover {
  border-color: var(--gold);
  background: linear-gradient(180deg, rgba(232, 177, 58, 0.14), transparent);
  transform: translateY(-2px);
}

.levelup-tag {
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
  font-weight: 700;
}

.levelup-title {
  font-weight: 700;
  font-size: 13.5px;
  margin-bottom: 6px;
  color: var(--gold);
}

.levelup-desc {
  white-space: pre-line;
  font-size: 12px;
  color: var(--bone-dim);
  line-height: 1.4;
}

.levelup-card:disabled { cursor: default; }

/* --- Game over stats --- */
.gameover-stats {
  margin: 18px 0 22px;
  text-align: left;
}

.new-best {
  text-align: center;
  color: var(--gold);
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 10px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.stat-row {
  display: flex;
  justify-content: space-between;
  padding: 8px 0;
  border-bottom: 1px solid var(--panel-border);
  font-size: 14px;
}

.stat-row strong {
  color: var(--bone);
}

.stat-row span {
  color: var(--bone-dim);
}

#sound-control {
  margin: 20px 0;
  padding: 12px 14px;
  border: 1px solid var(--panel-border);
  border-radius: 6px;
  background: #1c1018;
  color: var(--bone);
  font: 600 12px Inter, sans-serif;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

#sound-volume {
  width: 100%;
  height: 24px;
  margin: 0;
  accent-color: var(--gold);
  cursor: pointer;
}

#sound-volume:focus-visible { outline: 2px solid var(--gold); }

/* --- Small screens: shrink panel padding, stack cards --- */
@media (max-width: 520px) {
  .panel {
    padding: 24px 20px;
    width: 92vw;
  }
  .levelup-grid {
    grid-template-columns: 1fr;
  }
}

</style>
</head>
<body>

  <div id="game-wrap">
    <canvas id="game-canvas"></canvas>

    <!-- Touch pause button (visible always during play, styled via CSS) -->
    <button id="btn-pause-touch" class="icon-button" aria-label="Pausar">⏸</button>
    <button type="button" id="btn-dash" class="action-button btn-dash" aria-label="Dash">Dash</button>
    <button type="button" id="btn-ult" class="action-button btn-ult" aria-label="Definitiva">Ult</button>

    <!-- MAIN MENU -->
    <div id="screen-menu" class="screen">
      <div class="panel panel-menu">
        <h1 class="game-title">Circle vs Geometry</h1>
        <p class="subtitle">Sobrevive a la horda interminable. Sube de nivel. No mires atrás.</p>
        <button id="btn-start" class="btn-primary">Empezar</button>
        <div class="controls-hint">
          <strong>Movimiento:</strong> WASD / Flechas / Joystick táctil<br/>
          <strong>Dash:</strong> Espacio o Shift<br/>
          <strong>Definitiva:</strong> Q, E o R (se desbloquea al nivel 5)<br/>
          <strong>Pausa:</strong> Esc o P
        </div>
      </div>
    </div>

    <!-- LEVEL UP -->
    <div id="screen-levelup" class="screen hidden">
      <div class="panel panel-levelup">
        <h2 class="section-title">¡Subiste de nivel!</h2>
        <p class="subtitle">Elige una mejora</p>
        <div id="levelup-options" class="levelup-grid"></div>
      </div>
    </div>

    <!-- PAUSE -->
    <div id="screen-pause" class="screen hidden">
      <div class="panel">
        <h2 class="section-title">Pausa</h2>
        <div id="sound-control">
          <label for="sound-volume">Sonido: <output id="sound-percent" for="sound-volume">100%</output></label>
          <input id="sound-volume" type="range" min="0" max="100" step="1" value="100" aria-label="Volumen del sonido" />
        </div>
        <button id="btn-resume" class="btn-primary">Continuar</button>
        <button id="btn-restart-pause" class="btn-secondary">Reiniciar</button>
      </div>
    </div>

    <!-- GAME OVER -->
    <div id="screen-gameover" class="screen hidden">
      <div class="panel">
        <h2 class="section-title danger">Has caído</h2>
        <div id="gameover-stats" class="gameover-stats"></div>
        <button id="btn-restart-gameover" class="btn-primary">Volver a intentar</button>
      </div>
    </div>

  </div>
